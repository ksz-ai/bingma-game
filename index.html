<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>兵马 · 江湖对弈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="stage">

  <!-- 水墨装饰层 -->
  <div id="deco" aria-hidden="true">
    <svg class="mtn" viewBox="0 0 800 190" preserveAspectRatio="xMidYMax slice">
      <path d="M0,190 L0,120 Q60,70 120,105 Q170,55 240,95 Q300,30 380,85 Q450,50 520,90 Q590,40 660,80 Q720,60 800,95 L800,190 Z" fill="#191714" opacity="0.07"/>
      <path d="M0,190 L0,150 Q90,110 180,140 Q260,100 350,135 Q440,95 540,130 Q640,105 720,135 Q760,120 800,140 L800,190 Z" fill="#191714" opacity="0.12"/>
    </svg>
    <svg class="bamboo" viewBox="0 0 110 600" preserveAspectRatio="xMidYMin slice">
      <path d="M34,0 L38,600" stroke="#191714" stroke-width="7" opacity="0.10"/>
      <path d="M30,90 h12 M31,210 h12 M33,330 h12 M34,450 h12" stroke="#F2ECDD" stroke-width="3" opacity="0.5"/>
      <path d="M72,40 L74,600" stroke="#191714" stroke-width="5" opacity="0.07"/>
      <path d="M38,120 q34,-18 62,-8 q-30,22 -62,8 Z" fill="#191714" opacity="0.12"/>
      <path d="M36,240 q-30,-22 -34,-46 q34,10 34,46 Z" fill="#191714" opacity="0.10"/>
      <path d="M74,180 q30,-14 50,-4 q-26,18 -50,4 Z" fill="#191714" opacity="0.09"/>
      <path d="M73,320 q-26,-18 -30,-40 q30,9 30,40 Z" fill="#191714" opacity="0.08"/>
    </svg>
    <svg class="mist" viewBox="0 0 560 60" preserveAspectRatio="none">
      <ellipse cx="280" cy="30" rx="280" ry="26" fill="#F2ECDD" opacity="0.5"/>
    </svg>
  </div>
  <div id="wm" aria-hidden="true">武</div>
  <button id="btn-sound" title="古琴音效开关">音</button>

  <!-- 主菜单 -->
  <section id="menu-scr">
    <div id="title-row">
      <h1 id="title">兵马</h1>
      <span class="seal">武</span>
    </div>
    <p id="subtitle">江湖对弈 · 斗智斗气</p>
    <div id="rules" class="panel">
      <div id="rule-rows"></div>
      <div id="rules-foot">—— 双方同时暗中选招，斗的是预判与心理 ——</div>
    </div>
    <div id="diff-label">武 功 深 浅</div>
    <div id="diff-row">
      <button class="mbtn diff-btn" data-d="简单">初窥</button>
      <button class="mbtn diff-btn" data-d="中等">入门</button>
      <button class="mbtn diff-btn" data-d="困难">宗师</button>
    </div>
    <button id="btn-start" class="mbtn">拔剑开战 (S)</button>
    <button id="btn-pvp" class="mbtn ghost">联机对战 (N)</button>
  </section>

  <!-- 联机大厅 -->
  <section id="lobby-scr" class="hidden">
    <h2 id="lobby-title">联 机 对 弈</h2>
    <p id="lobby-sub">房号相连 · 与好友异地对决</p>
    <div id="lobby-home">
      <button id="btn-host" class="mbtn">创建房间</button>
      <div id="join-row">
        <input id="join-code" maxlength="5" placeholder="房号" autocomplete="off" spellcheck="false">
        <button id="btn-join" class="mbtn">加入房间</button>
      </div>
      <div id="lobby-tip">创建后把 5 位房号发给对方，即可开战</div>
    </div>
    <div id="lobby-wait" class="hidden">
      <div id="room-code-label">房 号</div>
      <div id="room-code">----</div>
      <div id="lobby-status">等待对手加入…</div>
    </div>
    <button id="btn-lobby-back" class="mbtn ghost">返回 (ESC)</button>
  </section>

  <!-- 游戏界面 -->
  <section id="game-scr" class="hidden">
    <header id="hud">
      <div class="stat-card p">
        <div class="sc-name">少侠 · 你</div>
        <div class="sc-row"><span class="sc-lbl">气</span><div class="qibar"><div class="fill" id="pq-fill"></div></div><span class="qv" id="pq-num">0</span></div>
        <div class="sc-row"><span class="sc-lbl">罡</span><span class="pips" id="p-pips"></span></div>
      </div>
      <div class="stat-card a">
        <div class="sc-name" id="ai-name">对手 · 简单</div>
        <div class="sc-row"><span class="sc-lbl">气</span><div class="qibar"><div class="fill" id="aq-fill"></div></div><span class="qv" id="aq-num">0</span></div>
        <div class="sc-row"><span class="sc-lbl">罡</span><span class="pips" id="a-pips"></span></div>
      </div>
    </header>
    <div id="hud-mid">
      <div id="round-label">第 1 回合</div>
      <div id="timerbar"><div id="timer-fill"></div></div>
      <div id="status">请出招</div>
    </div>

    <div id="arena" class="panel">
      <div class="zone z-sky"><span>屋脊</span></div>
      <div class="zone z-grd"><span>平地</span></div>
      <div class="zone z-under"><span>水底</span></div>
      <div class="token" id="tok-p">
        <div class="ring"></div>
        <div class="gshadow"></div>
        <div class="circle">
          <!-- 少侠：束发持剑，朱砂腰带剑穗 -->
          <svg viewBox="0 0 64 72" aria-hidden="true">
            <g fill="#191714">
              <circle cx="27" cy="5" r="3.2"/>
              <circle cx="27" cy="13" r="6.5"/>
              <path d="M27,19 C21,21 19,26 18,32 L15,47 L9,66 L17,62 L21,50 L23,66 L35,66 L33,49 L37,62 L44,66 L38,47 L36,32 C35,26 33,21 27,19 Z"/>
              <path d="M33,24 L48,20 L49,25 L34,29 Z"/>
              <path d="M45,16 L50,29 L47,30 L43,17 Z"/>
              <path d="M47,20 L64,10 L48,26 Z"/>
            </g>
            <path d="M20,35 L36,33" stroke="#A63A2B" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path d="M46,30 q-2,7 2,11" stroke="#A63A2B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
        <span class="sbadge"></span>
        <span class="pname">平地</span>
      </div>
      <div class="token" id="tok-a">
        <div class="ring"></div>
        <div class="gshadow"></div>
        <div class="circle">
          <!-- 斗笠客：镜像面向少侠 -->
          <svg viewBox="0 0 64 72" aria-hidden="true">
            <g transform="translate(64,0) scale(-1,1)">
              <g fill="#191714">
                <path d="M12,12 Q27,-2 42,12 L39,15 Q27,5 15,15 Z"/>
                <circle cx="27" cy="16" r="5.5"/>
                <path d="M27,21 C21,23 19,28 18,34 L15,48 L9,66 L17,62 L21,51 L23,66 L35,66 L33,50 L37,62 L44,66 L38,48 L36,34 C35,28 33,23 27,21 Z"/>
                <path d="M33,26 L48,22 L49,27 L34,31 Z"/>
                <path d="M45,18 L50,31 L47,32 L43,19 Z"/>
                <path d="M47,22 L64,12 L48,28 Z"/>
              </g>
              <path d="M20,37 L36,35" stroke="#38332B" stroke-width="3" stroke-linecap="round" fill="none"/>
              <path d="M46,32 q-2,7 2,11" stroke="#38332B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            </g>
          </svg>
        </div>
        <span class="qmark">?</span>
        <span class="sbadge"></span>
        <span class="pname">平地</span>
      </div>
    </div>

    <div id="logbox"></div>
    <div id="skills"></div>
    <div id="hint">数字键或点击招式牌出招 · ESC 收剑回菜单</div>
    <div id="feedback"></div>
    <div id="fx"></div>

    <div id="overlay" class="hidden">
      <div id="ov-panel">
        <span class="seal">决</span>
        <div id="ov-title">胜</div>
        <div id="ov-btns">
          <button id="btn-retry">再战 (R)</button>
          <button id="btn-menu">回客栈 (M)</button>
        </div>
        <div id="ov-hint">R 再战 · M 回菜单</div>
      </div>
    </div>
  </section>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
